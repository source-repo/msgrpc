# Build the VitePress site from docs/ and publish it to GitHub Pages.
#
# Requires Pages to be enabled once, by hand: Settings → Pages → Source: GitHub Actions. Until
# then the deploy job fails with a clear message and nothing else is affected - CI and Release
# are separate workflows.
name: Docs

on:
    push:
        branches: [main]
        paths: ['docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time, and a superseded one is not worth finishing.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # A lock file is a function of the npm that wrote it, and this one is written by npm 12.
            # npm 10 - what Node 22 bundles - resolves `@docsearch/react`'s peer range of react
            # `>= 16.8.0 < 19.0.0` against this workspace's React 19 by wanting a nested React 18
            # that an npm 12 lock does not record, and `npm ci` then refuses the whole install with
            # "Missing: react@18.3.1 from lock file" - which is where every workflow died for two
            # days. Node stays at 22 because that is what the packages claim to support; only the
            # installer is pinned, and npm 12 runs on 22.22.2 and up.
            - run: npm i -g npm@12

            - run: npm ci

            - run: npm run docs:build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
