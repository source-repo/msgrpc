# Build the VitePress site from docs/ and publish it to GitHub Pages.
#
# Requires Pages to be enabled once, by hand: Settings → Pages → Source: GitHub Actions. Until
# then the deploy job fails with a clear message and nothing else is affected - CI and Release
# are separate workflows.
name: Docs

on:
    push:
        branches: [main]
        paths: ['docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time, and a superseded one is not worth finishing.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run docs:build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
