%% Source Spark dual-session ACL example for EMQX 5.x.
%% Replace all sample identities and topic segments for each deployment.
%% Authentication must bind these usernames to separate credentials.

%% Sparkplug Edge session: publish only its own lifecycle/data namespace.
{allow, {user, "source-edge-01-sparkplug"}, publish, [
    "spBv1.0/plant-a/NBIRTH/source-rpc-gateway",
    "spBv1.0/plant-a/NDEATH/source-rpc-gateway",
    "spBv1.0/plant-a/NDATA/source-rpc-gateway",
    "spBv1.0/plant-a/DBIRTH/source-rpc-gateway/+",
    "spBv1.0/plant-a/DDEATH/source-rpc-gateway/+",
    "spBv1.0/plant-a/DDATA/source-rpc-gateway/+"
]}.
{allow, {user, "source-edge-01-sparkplug"}, subscribe, [
    "spBv1.0/plant-a/NCMD/source-rpc-gateway",
    "spBv1.0/plant-a/DCMD/source-rpc-gateway/+",
    "spBv1.0/STATE/primary-host"
]}.
{deny, {user, "source-edge-01-sparkplug"}, all, ["#"]}.

%% Source RPC session: full MQTT 5 Source RPC namespace as its authenticated principal.
{allow, {user, "source-edge-01-rpc"}, publish, [
    "msgrpc/v2/presence/source-edge-01-rpc",
    "msgrpc/v2/req/+",
    "msgrpc/v2/rsp/+",
    "msgrpc/v2/evt/+"
]}.
{allow, {user, "source-edge-01-rpc"}, subscribe, [
    "msgrpc/v2/presence/+",
    "msgrpc/v2/req/source-edge-01-rpc",
    "msgrpc/v2/rsp/source-edge-01-rpc",
    "msgrpc/v2/evt/source-edge-01-rpc"
]}.
{deny, {user, "source-edge-01-rpc"}, all, ["#"]}.

%% SCADA Primary Host: observe Sparkplug, command only this approved Edge Node.
{allow, {user, "scada-primary-host"}, subscribe, ["spBv1.0/#"]}.
{allow, {user, "scada-primary-host"}, publish, [
    "spBv1.0/plant-a/NCMD/source-rpc-gateway",
    "spBv1.0/plant-a/DCMD/source-rpc-gateway/+"
]}.
{deny, {user, "scada-primary-host"}, all, ["#"]}.

%% MCP gateway: no Sparkplug production I/O. Broker policy limits it to one RPC peer;
%% Source RPC authorization must separately restrict the methods/capabilities it can invoke.
{allow, {user, "source-spark-mcp"}, publish, [
    "msgrpc/v2/presence/source-spark-mcp",
    "msgrpc/v2/req/source-edge-01-rpc"
]}.
{allow, {user, "source-spark-mcp"}, subscribe, [
    "msgrpc/v2/presence/+",
    "msgrpc/v2/rsp/source-spark-mcp",
    "msgrpc/v2/evt/source-spark-mcp"
]}.
{deny, {user, "source-spark-mcp"}, all, ["#"]}.

%% Fail closed for every identity not covered above.
{deny, all}.
