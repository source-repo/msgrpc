# MQTT broker for local development and for the MQTT test in src/RpcServer.test.ts.
# Start with:  docker compose -f docker-compose/docker-compose.yml up -d
#
#   1883  MQTT           18083  dashboard (admin/public)
#   8083  MQTT over WS    8883  MQTT over TLS
services:
  emqx:
    image: emqx/emqx:5
    container_name: msgrpc-emqx
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '8083:8083'
      - '8883:8883'
      - '18083:18083'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
